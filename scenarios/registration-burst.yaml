# 500 people hit "register" inside one second for 300 seats, SSO is slow, and
# the client retries immediately on any failure. This is the shape of the
# IWAG and Codeforces incidents.
name: registration-burst
description: 500 synchronized arrivals, 1.5s SSO latency, naive client retries.

target:
  base_url: http://localhost:8080
  environment: local

hooks:
  before:
    - { path: /_bf/config, body: { profile: fragile, ssoLatencyMs: 1500, ssoTimeoutMs: 4000, ssoConcurrency: 250 } }
    - { path: /_bf/reset, body: { seats: 300 } }
  after:
    - { path: /_bf/config, body: { ssoLatencyMs: 40, ssoTimeoutMs: 800, ssoConcurrency: 25 } }

workflow:
  steps:
    - name: refresh_token
      method: POST
      path: /auth/refresh
      timeout: 4s
      retry: { max_attempts: 3, backoff: none }
      capture: { token: $.token }
    - name: register
      method: POST
      path: /register
      timeout: 4s
      ok_status: [201, 409]          # 409 = sold out / already registered, a valid business answer
      retry: { max_attempts: 3, backoff: none }
      headers:
        Authorization: "Bearer {{token}}"
        Idempotency-Key: "{{logical_id}}"
      body:
        email: "user-{{n}}-{{run_id}}@example.test"
        name: "User {{n}}"

traffic:
  profile: burst
  arrivals: 500
  window: 1s
  double_submit: 0.25              # a quarter of users tap twice (flaky mobile networks)
  double_submit_delay: 10ms

observe:
  url: /_bf/stats
  counters: [req_register, sso_calls, sso_timeouts, db_queries, shed_429]

invariants:
  - { name: no duplicate registrations, path: /_bf/invariants, json: $.duplicate_registrations, op: eq, value: 0 }
  - { name: no oversold seats,          path: /_bf/invariants, json: $.oversold,                op: eq, value: 0 }
  - { name: no lost confirmation jobs,  path: /_bf/invariants, json: $.jobs_lost,               op: eq, value: 0, eventually: 20s }
  - { name: job queue drains,           path: /_bf/invariants, json: $.jobs_pending,            op: eq, value: 0, eventually: 20s }

thresholds:
  p99_ms: 5000
  error_rate: 0.02
  retry_amplification: 2.0
  arrival_skew_p99_ms: 250
